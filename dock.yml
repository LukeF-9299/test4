services:
  opencode:
    image: openeuler/opencode:latest
    container_name: opencode
    stdin_open: true
    tty: true
    networks:
      - isolated
    environment:
      # Point opencode at the proxy instead of a real external endpoint.
      # Bifrost exposes an OpenAI-compatible API at /v1
      OPENAI_BASE_URL: http://bifrost-proxy:8080/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
    volumes:
      # The ONLY host folder opencode can see or modify.
      - ${OPENCODE_PROJECT_DIR:?Set OPENCODE_PROJECT_DIR to the single folder opencode may access}:/workspace
      # Global opencode config, mounted read-only so the agent can't alter it.
      - ./opencode.json:/root/.config/opencode/opencode.json:ro
    working_dir: /workspace

  bifrost-proxy:
    image: nginx:alpine
    container_name: bifrost-proxy
    networks:
      - isolated
      - egress
    environment:
      BIFROST_UPSTREAM: ${BIFROST_UPSTREAM:?Set BIFROST_UPSTREAM to your bifrost server, e.g. http://192.168.1.50:8080}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "8080"

networks:
  # opencode can ONLY reach other containers on this network — no internet.
  isolated:
    internal: true
  # bifrost-proxy uses this network for outbound access to your bifrost server.
  egress:
    driver: bridge
